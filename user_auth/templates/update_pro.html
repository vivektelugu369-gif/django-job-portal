{% extends 'main.html' %}

{% block css %}

<style>
    .profile-update-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
    }

    .profile-update-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .profile-update-header h1 {
        font-size: 30px;
        color: #222;
        margin-bottom: 10px;
        text-transform: capitalize;
    }

    .profile-update-header p {
        color: #666;
        font-size: 15px;
    }

    .profile-update-card {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
    }

    .profile-form-group {
        margin-bottom: 20px;
    }

    .profile-form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .profile-form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .profile-form-group input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .profile-update-btn {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    .profile-update-btn:hover {
        background: #1d4ed8;
    }

    .profile-update-footer {
        text-align: center;
        margin-top: 20px;
    }

    .profile-update-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }

    .profile-update-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {
        .profile-update-container {
            margin: 25px auto;
            padding: 12px;
        }

        .profile-update-card {
            padding: 22px;
        }

        .profile-update-header h1 {
            font-size: 26px;
        }
    }
</style>{% endblock %}

{% block content %}

<div class="profile-update-container"><div class="profile-update-header">
    <h1>Update Your Profile</h1>
    <p>Keep your personal information up to date.</p>
</div>

<div class="profile-update-card">
    <form action="" method="POST">
        {% csrf_token %}

        <div class="profile-form-group">
            <label for="fname">First Name</label>
            <input
                type="text"
                id="fname"
                name="fname"
                value="{{ request.user.first_name }}"
                placeholder="Enter your first name"
                required>
        </div>

        <div class="profile-form-group">
            <label for="lname">Last Name</label>
            <input
                type="text"
                id="lname"
                name="lname"
                value="{{ request.user.last_name }}"
                placeholder="Enter your last name"
                required>
        </div>

        <div class="profile-form-group">
            <label for="uname">User Name</label>
            <input
                type="text"
                id="uname"
                name="uname"
                value="{{ request.user.username }}"
                placeholder="Enter your username"
                required>
        </div>

        <div class="profile-form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ request.user.email }}"
                placeholder="Enter your email address"
                required>
        </div>

        <button type="submit" class="profile-update-btn">
            Update Profile
        </button>
    </form>

    <div class="profile-update-footer">
        <a href="{% url 'profile' %}">Back to Profile</a>
    </div>
</div>

</div>
{% endblock %}
