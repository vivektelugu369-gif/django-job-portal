{% extends 'main.html' %}
{% load static %}

{% block css %}

<style>
    .edit-job-container {
        max-width: 750px;
        margin: 40px auto;
        padding: 20px;
    }

    .edit-job-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .edit-job-header h1 {
        color: #163b65;
        font-size: 32px;
        margin-bottom: 10px;
    }

    .edit-job-header p {
        color: #666;
        font-size: 16px;
    }

    .edit-job-card {
        background: #fff;
        padding: 35px;
        border: 1px solid #e0e6ed;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .edit-form-group {
        margin-bottom: 22px;
    }

    .edit-form-group label {
        display: block;
        color: #26384a;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .edit-form-group input,
    .edit-form-group select,
    .edit-form-group textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #ccd5df;
        border-radius: 7px;
        background: #fff;
        color: #333;
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .edit-form-group input:focus,
    .edit-form-group select:focus,
    .edit-form-group textarea:focus {
        border-color: #1769aa;
        box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
    }

    .edit-form-group textarea {
        min-height: 140px;
        resize: vertical;
    }

    .edit-job-btn {
        display: block;
        width: 100%;
        padding: 14px;
        background: #1769aa;
        color: #fff;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }

    .edit-job-btn:hover {
        background: #104c80;
    }

    .back-jobs-link {
        display: inline-block;
        margin-top: 20px;
        color: #1769aa;
        text-decoration: none;
        font-weight: 600;
    }

    .back-jobs-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .edit-job-container {
            margin: 20px auto;
            padding: 15px;
        }

        .edit-job-header h1 {
            font-size: 27px;
        }

        .edit-job-card {
            padding: 22px 18px;
        }
    }
</style>{% endblock %}

{% block content %}

<div class="edit-job-container"><div class="edit-job-header">
    <h1>Edit Job</h1>
    <p>Update the details of your job posting.</p>
</div>

<div class="edit-job-card">
    <form action="" method="POST">
        {% csrf_token %}

        <div class="edit-form-group">
            <label for="title">Job Title</label>
            <input type="text" id="title" name="title" value="{{ job.title }}" required>
        </div>

        <div class="edit-form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" value="{{ job.company }}" required>
        </div>

        <div class="edit-form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{ job.location }}" required>
        </div>

        <div class="edit-form-group">
            <label for="job_type">Job Type</label>
            <select name="job_type" id="job_type" required>
                <option value="Full-time" {% if job.job_type == 'Full-time' %}selected{% endif %}>Full-time</option>
                <option value="Part-time" {% if job.job_type == 'Part-time' %}selected{% endif %}>Part-time</option>
                <option value="Internship" {% if job.job_type == 'Internship' %}selected{% endif %}>Internship</option>
                <option value="Contract" {% if job.job_type == 'Contract' %}selected{% endif %}>Contract</option>
            </select>
        </div>

        <div class="edit-form-group">
            <label for="salary">Salary</label>
            <input type="number" id="salary" name="salary" value="{{ job.salary|default_if_none:'' }}" min="0">
        </div>

        <div class="edit-form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" required>{{ job.description }}</textarea>
        </div>

        <div class="edit-form-group">
            <label for="required_skills">Required Skills</label>
            <input type="text" id="required_skills" name="required_skills" value="{{ job.required_skills }}" required>
        </div>

        <button type="submit" class="edit-job-btn">Update Job</button>
    </form>
</div>

<center>
    <a href="{% url 'jobs' %}" class="back-jobs-link">Back to Jobs</a>
</center>

</div>
{% endblock %}
