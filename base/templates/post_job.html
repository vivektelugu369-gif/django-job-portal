{% extends 'main.html' %}
{% load static %}

{% block css %}
<style>
        .post-job-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        .post-job-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .post-job-header h1 {
            color: #163b65;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .post-job-header p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .post-job-card {
            background: #fff;
            padding: 35px;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #26384a;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ccd5df;
            border-radius: 7px;
            background: #fff;
            color: #333;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .post-job-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #1769aa;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .post-job-btn:hover {
            background: #104c80;
        }

        @media (max-width: 600px) {
        .post-job-container {
            margin: 20px auto;
            padding: 15px;
        }

        .post-job-header h1 {
            font-size: 27px;
        }

        .post-job-card {
            padding: 22px 18px;
        }

        }

</style>
{% endblock %}
{% block content %}

<div class="post-job-container"><div class="post-job-header">
    <h1>Post a Job</h1>
    <p>Share your opportunity and connect with the right candidates.</p>
</div>

<div class="post-job-card">
    <form action="" method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Job Title</label>
            <input type="text" id="title" name="title" placeholder="e.g. Python Developer" required>
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Enter company name" required>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Bangalore" required>
        </div>

        <div class="form-group">
            <label for="job_type">Job Type</label>
            <select name="job_type" id="job_type" required>
                <option value="">Select Job Type</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Internship">Internship</option>
                <option value="Contract">Contract</option>
            </select>
        </div>

        <div class="form-group">
            <label for="salary">Annual Salary (₹)</label>
            <input type="number" id="salary" name="salary" placeholder="Enter annual salary" min="0">
        </div>

        <div class="form-group">
            <label for="description">Job Description</label>
            <textarea name="description" id="description" placeholder="Describe the job responsibilities and requirements" required></textarea>
        </div>

        <div class="form-group">
            <label for="required_skills">Required Skills</label>
            <input type="text" id="required_skills" name="required_skills" placeholder="e.g. Python, Django, SQL" required>
        </div>

        <button type="submit" class="post-job-btn">Post Job</button>
    </form>
</div>

</div>
{% endblock %}
